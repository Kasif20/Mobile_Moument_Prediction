name: Ruff CI

on: 
  push: 
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  ruff:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

      - name: Run Ruff Formatter check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
