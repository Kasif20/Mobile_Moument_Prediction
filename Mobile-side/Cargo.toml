[package]
name = "sensor_manager"
version = "0.1.0"
edition = "2024"

[lib]
name 	   = "sensor_manager"
crate-type = ["cdylib"]

[profile.release]
opt-level     = 1
lto	      = "off"
codegen-units = 16
strip	      = true

[dependencies]
android_sensor-sys = "0.1.3"
android_looper-sys = "0.1.0"
libc		   = "0.2"
pyo3 		   = {version = "0.23",features = ["extension-module"]}

